[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.nuxt]
url = "https://nuxt.com/mcp"

[mcp_servers.ui-nuxt]
url = "https://ui.nuxt.com/mcp"

developer_instructions = "Use ../worktrees/<branch> as the default location for Git worktrees, alongside repo-stable."

[features]
multi_agent = true
